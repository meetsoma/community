name: Build Hub Index

on:
  push:
    branches: [main]
    paths:
      - 'protocols/**'
      - 'muscles/**'
      - 'skills/**'
      - 'scripts/**'
      - 'templates/**'
      - 'automations/**'

permissions:
  contents: write

jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # REQUIRED, not tidiness: build-hub-index.mjs dates each template from
          # `git log -1 -- <file>`. The default shallow checkout (depth 1) has one commit,
          # so every file untouched by it reports NO history and loses its `updated:`.
          # The field this replaced used file mtime, which in a fresh clone is the CLONE
          # TIME — every template stamped with the build day. Shallow-checkout here would
          # reproduce that class of defect in a new spelling.
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Build hub-index.json
        run: node scripts/build-hub-index.mjs

      - name: Commit if changed
        id: commit
        run: |
          git config user.name "meetsoma[bot]"
          git config user.email "meetsoma[bot]@users.noreply.github.com"
          git add hub-index.json
          if git diff --cached --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            git commit -m "chore: rebuild hub-index.json [skip ci]"
            git push
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      # Deploy hook removed — hub pages are now dynamic (HubDetail.tsx fetches
      # from GitHub raw at runtime). No website rebuild needed for new content.
