name: Community PR Review

on:
  pull_request:
    branches: [main]
    paths:
      - 'protocols/**'
      - 'muscles/**'
      - 'skills/**'
      - 'scripts/**'
      - 'templates/**'
      - 'automations/**'
      # extensions/** added s01-2e87ae: it was in NO workflow's paths AND in neither
      # scanner's find, so an executable extension triggered zero CI. Every gated type
      # was inert markdown; the one type that EXECUTES was ungated.
      - 'extensions/**'
      # 🔴 .github/scripts/** — THE GATE MUST GATE ITSELF. Without this, a PR that edits
      # injection-scan.sh or privacy-scan.sh does not trigger the workflow that RUNS them:
      # someone could weaken or no-op a scanner and no scanner would run on the change.
      # main-guard.yml already lists it (:22); pr-review did not. Same shape as the hole
      # closed earlier in this session — the gated set did not include the thing doing the
      # gating — found by an assertion audit of that very fix. (s01-2e87ae)
      - '.github/scripts/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    name: Safety & Format Checks
    runs-on: ubuntu-latest
    outputs:
      tier_review_needed: ${{ steps.tier.outputs.review_needed }}
      gate_review_needed: ${{ steps.gates.outputs.review_needed }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # A change that EXECUTES on every user's machine (a protocol's gates: block, a script, an extension) gets a
      # human reader even from a trusted author: auto-merge is for prose. The gate's own regex cannot be reviewed by a scanner.
      - name: Executable-content guard
        id: gates
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          CHANGED=$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD)
          NEEDS=false
          for f in $CHANGED; do
            case "$f" in
              scripts/*|extensions/*|.github/*) NEEDS=true ;;
              *.md) [ -f "$f" ] && grep -qE '^gates:' "$f" && NEEDS=true ;;
            esac
          done
          echo "review_needed=$NEEDS" >> $GITHUB_OUTPUT
          echo "Executable content changed: $NEEDS"
        with:
          fetch-depth: 0

      - name: Validate frontmatter
        run: bash .github/scripts/validate-frontmatter.sh

      - name: Privacy scan
        run: bash .github/scripts/privacy-scan.sh

      - name: Injection scan
        run: bash .github/scripts/injection-scan.sh

      - name: Format compliance
        run: bash .github/scripts/format-check.sh

      - name: Tier guard
        id: tier
        run: |
          OUTPUT=$(bash .github/scripts/tier-guard.sh)
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -q "TIER_REVIEW_NEEDED=true"; then
            echo "review_needed=true" >> $GITHUB_OUTPUT
          fi
        env:
          GITHUB_ACTOR: ${{ github.event.pull_request.user.login }}

      - name: Attribution check
        run: bash .github/scripts/attribution-check.sh
        env:
          GITHUB_ACTOR: ${{ github.event.pull_request.user.login }}

  auto-merge:
    name: Auto-Merge (Trusted)
    needs: validate
    if: success()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check auto-merge eligibility
        id: check
        run: |
          AUTHOR="${{ github.event.pull_request.user.login }}"
          ROLE=$(jq -r --arg a "$AUTHOR" '.members[$a].role // .defaults.role' MAINTAINERS.json)
          ELIGIBLE=$(jq -r --arg r "$ROLE" '.roles[$r].auto_merge' MAINTAINERS.json)
          echo "author=$AUTHOR" >> $GITHUB_OUTPUT
          echo "role=$ROLE" >> $GITHUB_OUTPUT
          echo "eligible=$ELIGIBLE" >> $GITHUB_OUTPUT
          echo "Author: $AUTHOR, Role: $ROLE, Auto-merge: $ELIGIBLE"

      - name: Generate app token
        if: steps.check.outputs.eligible == 'true'
        id: token
        uses: actions/create-github-app-token@v1
        with:
          app-id: 3108591
          private-key: ${{ secrets.SOMA_APP_PEM }}

      - name: Approve and merge
        if: steps.check.outputs.eligible == 'true' && needs.validate.outputs.tier_review_needed != 'true' && needs.validate.outputs.gate_review_needed != 'true'
        run: |
          gh pr review ${{ github.event.pull_request.number }} --approve \
            --body "σ All checks passed. Auto-merging for trusted ${{ steps.check.outputs.role }}: ${{ steps.check.outputs.author }}"
          gh pr merge ${{ github.event.pull_request.number }} --squash --auto
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}

      - name: Label for manual review
        if: steps.check.outputs.eligible != 'true' || needs.validate.outputs.gate_review_needed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const labels = ['needs-review'];
            const tierReview = '${{ needs.validate.outputs.tier_review_needed }}' === 'true';
            const gateReview = '${{ needs.validate.outputs.gate_review_needed }}' === 'true';
            if (gateReview) labels.push('executable-content');
            if (tierReview) labels.push('tier-review');
            
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              labels
            });
            
            const tierNote = tierReview
              ? '\n\n⚠️ **This PR modifies core/official content.** Contributions are welcome — a maintainer will review and credit you if merged.'
              : '';
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: `σ All automated checks passed. Waiting for maintainer review.${tierNote}\n\nAuthor: \`${{ steps.check.outputs.author }}\` (role: \`${{ steps.check.outputs.role }}\`)`
            });
